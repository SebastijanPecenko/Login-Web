<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background"></div>
    <div class="background-overlay"></div>
    <div class="login-box">
        <h1>Welcome Back</h1>
        <p class="subtitle">Continue your journey</p>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                    <button type="button" id="showPassword">👁</button>
                </div>
            </div>
            <div class="login-options">
                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="login-button">
                Login
            </button>
        </form>

        <div class="divider">
            <span>or continue with</span>
        </div>
        <div class="social-buttons">
            <button type="button" class="social-button google">
                <span>G</span>
                Continue with Google
            </button>
            <button type="button" class="social-button facebook">
                <span>f</span>
                Continue with Facebook
            </button>
        </div>
        <p class="register-text">
            Don't have an account?
            <a href="register.html">Create account</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
		//pravilni podatki
        let pravilniEmail = "test@gmail.com";
        let pravilnoGeslo = "12345";
		
        let obrazec = document.getElementById("loginForm");
        let email = document.getElementById("email");
        let geslo = document.getElementById("password");
        let gumbGeslo = document.getElementById("showPassword");
        obrazec.addEventListener("submit", function(event) {
            event.preventDefault();
            let vpisanEmail = email.value;
            let vpisanoGeslo = geslo.value;
            if (
                vpisanEmail === pravilniEmail &&
                vpisanoGeslo === pravilnoGeslo
            ) {
                Swal.fire({
                    title: "Login successful!",
                    text: "Welcome back traveler!",
                    icon: "success",
                });
            } else {
                Swal.fire({
                    title: "Error!",
                    text: "Wrong email or password.",
                    icon: "error",
                });
            }
        });

        gumbGeslo.addEventListener("click", function() {
            if (geslo.type === "password") {
                geslo.type = "text";
            } else {
                geslo.type = "password";
            }
        });
    </script>
</body>
</html>
